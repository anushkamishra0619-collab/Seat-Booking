
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Seat Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <h3 class="navbar">An Evening At</h3>
    <div class="event">
        <h1>NightFall Sessions</h1>
    </div>
    <div class="nad">
        <h4>November 14, 2026</h4>
        <h5>The Riverside Auditorium</h5>
        <h6>60 seats</h6>
    </div>
    </div>
    <div class="container">
        <h2>Select Your Seats</h2>
        <div class="stage">
            STAGE
        </div>
        <div class="seat-area" id="seatArea"></div>
        <div class="bookinginfo">
            <p>
                Selected Seats:
                <span id="selectedSeats">None</span>
            </p>
            <p>
                Total:
                Rs<span id="price">0</span>
            </p>
            <button id="bookbutton">Book Now</button>
        </div>
        <div class="me">
            <div>
                <span class="VIP"></span>
                VIP Rs 500
            </div>
            <div>
                <span class="Premium"></span>
                Premium Rs 300
            </div>
            <div>
            <span class="Regular"></span>
            Regular Rs 150
            </div>
            <div>
                <span class="booked"></span>
                Booked
            </div>
        </div>
        </div>




    </div>


    
</body>
</html>
