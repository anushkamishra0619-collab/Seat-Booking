<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeatSpotter | Event Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-page">
    <a class="welcome-brand" href="index.html" aria-label="SeatSpotter home">
        <span class="welcome-logo" aria-hidden="true">S</span>
        <span>SeatSpotter</span>
    </a>
    <nav class="auth-actions" aria-label="Account actions">
        <button class="auth-button auth-button-secondary" type="button" data-auth-open="login-modal">Log in</button>
        <button class="auth-button" type="button" data-auth-open="signup-modal">Sign up</button>
    </nav>
    <main class="welcome-content">
        <p class="welcome-kicker">SEATSPOTTER PRESENTS</p>
        <h1>Find Your Seat For An Unforgettable Event</h1>
        <p class="welcome-description">
            Choose An Event To Explore
        </p>
        <a class="goto-button" href="booking.html">Go to booking</a>
    </main>

    <div class="auth-modal" id="login-modal" hidden>
        <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="login-title">
            <button class="auth-close" type="button" data-auth-close aria-label="Close login form">&times;</button>
            <p class="auth-kicker">WELCOME BACK</p>
            <h2 id="login-title">Log in to SeatSpotter</h2>
            <form class="auth-form" id="login-form">
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
                <button class="auth-submit" type="submit">Log in</button>
                <p class="auth-message" id="login-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </div>

    <div class="auth-modal" id="signup-modal" hidden>
        <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="signup-title">
            <button class="auth-close" type="button" data-auth-close aria-label="Close sign up form">&times;</button>
            <p class="auth-kicker">JOIN THE EXPERIENCE</p>
            <h2 id="signup-title">Create your account</h2>
            <form class="auth-form" id="signup-form">
                <label for="signup-username">Username</label>
                <input id="signup-username" name="username" type="text" autocomplete="username" minlength="2" required>
                <label for="signup-email">Email</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" required>
                <label for="signup-password">Password</label>
                <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
                <button class="auth-submit" type="submit">Sign up</button>
                <p class="auth-message" id="signup-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </div>
    <script src="auth.js"></script>
</body>
</html>
