
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Seat Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <h3 class="navbar">An Evening At</h3>
    <div class="event">
        <h1>NightFall Sessions</h1>
    </div>
    <div class="nad">
        <h4>November 14, 2026</h4>
        <h5>The Riverside Auditorium</h5>
        <h6>60 seats</h6>
    </div>
    </div>
    <div class="container">
        <h2>Select Your Seats</h2>
        <div class="stage">
            STAGE
        </div>
    </div>

    <div class="booking-panel">
        <div class="card">
            <h2 class="card-title">Filter Seats</h2>
            <div class="dropdown-container">
                <div class="select-wrapper">
                    <select>
                        <option>All categories</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select>
                        <option>All seats</option>
                    </select>
                </div>
            </div>
            <div class="stats-row">
                <div>Booked: <span>0</span></div>
                <div>Remaining: <span>60</span></div>
            </div>
        </div>
        <div class="card">
            <h2 class="card-title">Booking Summary</h2>
            <div class="empty-message">No seats selected yet.</div>
            
            <div class="total-row">
                <div class="total-label">Total</div>
                <div class="total-price">₹0</div>
            </div>

            <button class="confirm-btn">Confirm Booking</button>
        </div>
    </div>

</body>
</html>



    
</body>
</html>
